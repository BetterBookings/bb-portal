name: Deploy to GitHub Pages

on:
  # Auto-deploy a ogni push su main
  push:
    branches: [main]
  # Permette di lanciarlo manualmente dal pannello GitHub Actions
  workflow_dispatch:

# Permessi che il workflow richiede per pubblicare su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola istanza di deploy alla volta; cancella job in coda obsoleti
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # GITHUB_ACTIONS=true è già settato automaticamente → vite.config.js
        # usa base='/' invece di '/manage/' (sub-domain root)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
